<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - Elity Polski - układ zamknięty</title>
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="container mx-auto px-4 pt-4"><div data-person-search></div></div>
<div id="app" class="container mx-auto p-4">
  <a href="/static/index.html" class="inline-block mb-3 text-blue-500 hover:underline">← Wróć do grafu</a>
  <h1 class="text-2xl font-bold mb-4">{{ person ? person.name : 'Profil' }}</h1>

  <div v-if="error" class="mb-6 bg-red-100 p-4 rounded shadow text-red-700">
    {{ error }}
  </div>

  <div v-if="person" class="mb-6 bg-white p-6 rounded shadow flex flex-col md:flex-row gap-6 items-center md:items-start">
    <img v-if="hasPhoto" class="profile-photo" :src="person.image_url" :alt="person.name" @error="photoFailed = true">
    <div v-else class="profile-photo profile-planet" :style="{ background: planetBackground }">{{ initials }}</div>
    <div class="flex-1">
      <h2 class="text-2xl font-bold mb-1">{{ person.name }}</h2>
      <p v-if="person.occupation" class="mb-4" style="color: var(--neon)">{{ person.occupation }}</p>
      <p v-if="person.description" class="profile-description mb-4">{{ person.description }}</p>
      <p v-else class="mb-4" style="color: var(--muted)">Brak opisu.</p>
      <p v-if="person.twitter">
        <a :href="'https://x.com/' + encodeURIComponent(person.twitter.replace(/^@/, ''))"
           target="_blank" rel="noopener noreferrer" class="text-blue-500 hover:underline">@{{ person.twitter.replace(/^@/, '') }}</a>
      </p>
    </div>
  </div>

  <div v-show="person" class="mb-6">
    <h2 class="text-xl font-bold mb-2">Powiązania</h2>
    <p v-if="graphMessage" style="color: var(--muted)">{{ graphMessage }}</p>
    <div v-show="!graphMessage" class="graph-container">
      <div id="graph"></div>
    </div>
  </div>
</div>

<script src="/static/graph.js"></script>
<script>
  const { createApp, ref, computed, onMounted, nextTick } = Vue;

  createApp({
    setup() {
      const person = ref(null);
      const error = ref('');
      const photoFailed = ref(false);
      const graphMessage = ref('');

      const hasPhoto = computed(() => Boolean(person.value.image_url) && !photoFailed.value);
      const initials = computed(() => initialsOf(person.value.name));
      const planetBackground = computed(() => {
        const [highlight, body, shadow] = planetPaletteOf(person.value.id);
        return `radial-gradient(circle at 35% 30%, ${highlight} 0%, ${body} 45%, ${shadow} 100%)`;
      });

      const showRelationsOf = async (id) => {
        const response = await fetch('/graph');
        if (!response.ok) {
          graphMessage.value = `Błąd pobierania powiązań: ${response.status} ${response.statusText}`;
          return;
        }
        const graph = await response.json();
        const hasRelations = graph.edges.some((edge) => edge.source_id === id || edge.target_id === id);
        if (!hasRelations) {
          graphMessage.value = `${person.value.name} nie ma jeszcze żadnych powiązań.`;
          return;
        }
        await nextTick();
        renderRelationsGraph('#graph', graph, { focusId: id });
      };

      onMounted(async () => {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) {
          error.value = 'Nie podano identyfikatora osoby';
          return;
        }
        try {
          const response = await fetch(`/person/${encodeURIComponent(id)}`);
          if (response.status === 404) {
            error.value = 'Nie znaleziono osoby';
            return;
          }
          if (!response.ok) {
            error.value = `Błąd pobierania osoby: ${response.status} ${response.statusText}`;
            return;
          }
          person.value = await response.json();
          document.title = `${person.value.name} - Elity Polski - układ zamknięty`;
          await showRelationsOf(id);
        } catch (err) {
          error.value = 'Błąd pobierania osoby: ' + err.message;
        }
      });

      return { person, error, photoFailed, hasPhoto, initials, planetBackground, graphMessage };
    }
  }).mount('#app');
</script>
<script src="/static/search.js"></script>
<script src="/static/cosmos.js"></script>
</body>
</html>
