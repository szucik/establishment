<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elity Polski - układ zamknięty</title>
    <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        #app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .notice { margin-bottom: 12px; padding: 8px 12px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="search-bar"><div data-person-search></div></div>
<div id="app">
    <div v-if="error" class="notice bg-red-100 text-red-700">{{ error }}</div>
    <div class="graph-container">
        <div id="graph"></div>
    </div>
</div>

<script src="/static/graph.js"></script>
<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const error = ref('');

            onMounted(async () => {
                try {
                    const response = await fetch('/graph');
                    if (!response.ok) {
                        error.value = `Błąd pobierania grafu: ${response.status} ${response.statusText}`;
                        return;
                    }
                    error.value = renderRelationsGraph('#graph', await response.json());
                } catch (err) {
                    error.value = 'Błąd pobierania grafu: ' + err.message;
                }
            });

            return { error };
        }
    }).mount('#app');
</script>
<script src="/static/search.js"></script>
<script src="/static/cosmos.js"></script>
</body>
</html>
